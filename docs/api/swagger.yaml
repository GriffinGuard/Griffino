basePath: /api/v1
definitions:
  github_com_GriffinGuard_Griffino_internal_router.ProviderEntry:
    properties:
      interfaceRef:
        description: |-
          InterfaceRef is the provider's standard interface (e.g.
          "griffino.interfaces.ai.chat@1.0.0"), filled server-side from the provider's
          manifest. Providers are treated as interchangeable only when their interface
          major versions are compatible / provider 的标准接口，用于互换前的主版本兼容校验.
        type: string
      providerId:
        type: string
      providerTopic:
        type: string
      weight:
        type: integer
    type: object
  github_com_GriffinGuard_Griffino_internal_router.Route:
    properties:
      capabilityType:
        type: string
      pluginId:
        type: string
      providers:
        items:
          $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_router.ProviderEntry'
        type: array
      slot:
        type: string
      strategy:
        description: '"fallback" | "round_robin"'
        type: string
    type: object
  github_com_GriffinGuard_Griffino_internal_store.PluginStatus:
    enum:
    - pending_setup
    - ready
    - pulling
    - starting
    - running
    - stopped
    - failed
    type: string
    x-enum-comments:
      StatusFailed: Start failed / 启动失败
      StatusPendingSetup: Manifest downloaded, config not yet done / 元文件已下载，未完成配置
      StatusPulling: Pulling images / 正在拉取镜像
      StatusReady: Config done, never started / 配置完成，从未启动
      StatusRunning: Running / 运行中
      StatusStarting: Images ready, container starting / 镜像就绪，容器启动中
      StatusStopped: Stopped / 已停止
    x-enum-varnames:
    - StatusPendingSetup
    - StatusReady
    - StatusPulling
    - StatusStarting
    - StatusRunning
    - StatusStopped
    - StatusFailed
  github_com_GriffinGuard_Griffino_internal_store.SecurityPolicies:
    properties:
      lockoutDurationMinutes:
        description: LockoutDurationMinutes is how long the account is locked after
          too many failures (default 15).
        type: integer
      maxLoginAttempts:
        description: MaxLoginAttempts is the number of consecutive failures before
          lockout (default 5).
        type: integer
      sessionTtlHours:
        description: SessionTTLHours is how long a session token stays valid (default
          168 = 7 days).
        type: integer
    type: object
  github_com_GriffinGuard_Griffino_internal_taskscheduler.Blueprint:
    properties:
      createdAt:
        type: string
      id:
        type: string
      metadata:
        $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.BlueprintMeta'
      name:
        type: string
      nodes:
        items:
          $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.Node'
        type: array
      trigger:
        $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.Trigger'
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  github_com_GriffinGuard_Griffino_internal_taskscheduler.BlueprintMeta:
    properties:
      flowPositions:
        additionalProperties:
          $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.FlowPosition'
        type: object
    type: object
  github_com_GriffinGuard_Griffino_internal_taskscheduler.FlowPosition:
    properties:
      x:
        type: number
      "y":
        type: number
    type: object
  github_com_GriffinGuard_Griffino_internal_taskscheduler.Node:
    properties:
      capabilityId:
        description: 'Built-in: if/loop/input/output / 内置节点'
        type: string
      id:
        type: string
      nextNodes:
        items:
          type: string
        type: array
      pluginId:
        description: '"__builtin__" for built-in nodes / 表示内置节点'
        type: string
      requestTopicPattern:
        description: Built-in nodes reuse this for expressions/variable declarations
          / 内置节点复用此字段存表达式/变量声明
        type: string
      timeoutMs:
        type: integer
    type: object
  github_com_GriffinGuard_Griffino_internal_taskscheduler.Task:
    properties:
      activeBranches:
        description: |-
          ─── Parallel execution state (W5) ──────────────────────────────────────
          ActiveBranches: number of currently live parallel branches. Starts at 1 when a Task is created;
          += N-1 when a node fans out to N NextNodes;
          -= 1 when a branch reaches a terminal leaf, triggering completeTask when it hits zero;
          net -= k-1 when a join absorbs k incoming edges / 当前存活的并行分支数
        type: integer
      activeNodes:
        additionalProperties:
          type: string
        description: |-
          ActiveNodes: in-flight plugin node → its reply deadline. Replaces the old single Deadline;
          in parallel, multiple in-flight nodes can coexist. The watchdog scans this table, marking the Task as timed out if any entry expires / 在途插件节点及其回复截止时间
        type: object
      blueprintId:
        type: string
      context:
        additionalProperties: {}
        description: 'Pipeline accumulated variables, merged after each step (concurrent
          writes: last-write-wins) / 流水线累积变量'
        type: object
      createdAt:
        type: string
      currentNodeId:
        description: Most recently advanced node (best-effort, observation-only; not
          unique in parallel) / 最近推进到的节点
        type: string
      displayName:
        type: string
      failReason:
        type: string
      id:
        type: string
      joinState:
        additionalProperties:
          type: integer
        description: |-
          JoinState: join node ID → current arrival count. Resets to 0 when arrivals reach the static in-degree,
          supporting join re-entry inside loops / join 节点 ID → 当前已到达的分支数
        type: object
      loopState:
        additionalProperties:
          type: integer
        description: 'key: nodeId, value: current iteration count / 当前迭代次数'
        type: object
      status:
        $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.TaskStatus'
      triggerPluginId:
        description: Triggering plugin ID, used for callbacks / 触发方插件 ID，用于回调
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  github_com_GriffinGuard_Griffino_internal_taskscheduler.TaskStatus:
    enum:
    - running
    - completed
    - failed
    type: string
    x-enum-varnames:
    - TaskStatusRunning
    - TaskStatusCompleted
    - TaskStatusFailed
  github_com_GriffinGuard_Griffino_internal_taskscheduler.Trigger:
    properties:
      eventType:
        type: string
      pluginId:
        description: Empty means any source / 为空表示任意来源
        type: string
    type: object
  internal_api.AppError:
    properties:
      code:
        $ref: '#/definitions/internal_api.ErrorCode'
      detail: {}
      message:
        type: string
    type: object
