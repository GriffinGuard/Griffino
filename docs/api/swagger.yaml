host: 127.0.0.1:7070
info:
  contact: {}
  description: Local-only control-plane API for the Griffino daemon. The API binds
    to 127.0.0.1:7070 and is consumed by the embedded web console. All non-public
    endpoints require a bearer session token obtained from POST /auth/login.
  title: Griffino API
  version: "1.0"
paths:
  /admin/metrics:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Get admin dashboard metrics
      tags:
      - Admin
  /admin/settings/security:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_store.SecurityPolicies'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Get security policies
      tags:
      - Settings
    put:
      consumes:
      - application/json
      parameters:
      - description: security policies
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_store.SecurityPolicies'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Update security policies
      tags:
      - Settings
  /audit-logs:
    get:
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        type: integer
      - description: Items per page (default 20, max 100)
        in: query
        name: pageSize
        type: integer
      - description: Filter by actor username
        in: query
        name: actor
        type: string
      - description: Filter by action type
        in: query
        name: action
        type: string
      - description: Filter by resource
        in: query
        name: resource
        type: string
      - description: Start time (ISO 8601)
        in: query
        name: from
        type: string
      - description: End time (ISO 8601)
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - Admin
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: username and password
        in: body
        name: credentials
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      summary: Log in
      tags:
      - Auth
  /auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Log out
      tags:
      - Auth
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/password:
    post:
      consumes:
      - application/json
      parameters:
      - description: oldPassword and newPassword
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Change password
      tags:
      - Auth
  /blueprints:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.Blueprint'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: List blueprints
      tags:
      - Blueprints
    post:
      consumes:
      - application/json
      parameters:
      - description: name, trigger, nodes, metadata
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.Blueprint'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Create a blueprint
      tags:
      - Blueprints
  /blueprints/{id}:
    delete:
      parameters:
      - description: Blueprint ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Delete a blueprint
      tags:
      - Blueprints
    get:
      parameters:
      - description: Blueprint ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.Blueprint'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Get a blueprint
      tags:
      - Blueprints
    put:
      consumes:
      - application/json
      parameters:
      - description: Blueprint ID
        in: path
        name: id
        required: true
        type: string
      - description: name, trigger, nodes, metadata
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_GriffinGuard_Griffino_internal_taskscheduler.Blueprint'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Update a blueprint
      tags:
      - Blueprints
  /me/dashboard:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Get dashboard layout
      tags:
      - Dashboard
    put:
      consumes:
      - application/json
      parameters:
      - description: dashboard layout payload
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Save dashboard layout
      tags:
      - Dashboard
  /me/sessions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: List active sessions
      tags:
      - Sessions
  /me/sessions/{sessionID}:
    delete:
      parameters:
      - description: Session ID to revoke
        in: path
        name: sessionID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Revoke a session
      tags:
      - Sessions
  /plugins:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/internal_api.PluginDTO'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: List installed plugins
      tags:
      - Plugins
  /plugins/{id}:
    delete:
      parameters:
      - description: Plugin ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_api.AppError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_api.AppError'
      security:
      - BearerAuth: []
      summary: Uninstall a plugin
