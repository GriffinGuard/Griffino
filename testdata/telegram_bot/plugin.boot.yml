pluginBootSpecVersion: "1.0"
pluginId: "cc.griffino.telegram_bot"
mainServiceId: "bot-app"

services:

  # -------------------------------------------------------
  # 辅助服务：本地 Telegram Bot API 服务器
  # -------------------------------------------------------
  telegram-bot-api:
    image: "aiogram/telegram-bot-api:latest"
    environment:
      # 由管理员通过 config.boot.json 填写，Griffino 注入
      - "TELEGRAM_API_ID"
      - "TELEGRAM_API_HASH"
      # 固定值
      - "TELEGRAM_LOCAL=1"
      - "TELEGRAM_HTTP_IP_ADDRESS=0.0.0.0"
    ports:
      - name: "http-api"
        internal: 8081
        protocol: "tcp"
    volumes:
      - name: "telegram_api_data"
        mount_path: "/var/lib/telegram-bot-api"

  # -------------------------------------------------------
  # 辅助服务：Redis
  # -------------------------------------------------------
  redis:
    image: "redis:6-alpine"
    command: "redis-server --save 60 1 --loglevel warning"
    volumes:
      - name: "redis_data"
        mount_path: "/data"

  # -------------------------------------------------------
  # 主服务：Bot 应用
  # -------------------------------------------------------
  bot-app:
    build_instructions:
      context: "."
      dockerfile: "Dockerfile"
    image: "griffino-dev/telegram-bot:local-latest"

    depends_on:
      - "redis"
      - "telegram-bot-api"

    environment:
      # --- 由管理员通过 config.boot.json 填写，Griffino 注入 ---
      - "TELEGRAM_BOT_TOKEN"

      # --- 由 Griffino 自动注入（RabbitMQ 连接信息）---
      - "RABBITMQ_HOST={{system.rabbitmq.host}}"
      - "RABBITMQ_PORT={{system.rabbitmq.port}}"
      - "RABBITMQ_USER={{system.rabbitmq.user}}"
      - "RABBITMQ_PASSWORD={{system.rabbitmq.password}}"

      # --- 插件内部服务链接，Griffino 根据容器运行时信息解析 ---
      - "BOT_API_URL=http://{{services.telegram-bot-api.name}}:{{services.telegram-bot-api.ports.http-api.internal}}"
      - "REDIS_HOST={{services.redis.name}}"

      # --- 固定值 ---
      - "TZ=Asia/Shanghai"
      - "PYTHONUNBUFFERED=1"

    volumes:
      - name: "media_data"
        mount_path: "/app/media"
